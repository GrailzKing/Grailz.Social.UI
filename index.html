<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Grailz Media Template</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Bebas+Neue&family=Permanent+Marker&family=Bungee&family=Rye&family=Luckiest+Guy&family=Orbitron:wght@700;900&family=Playfair+Display:wght@800;900&family=Pacifico&family=Staatliches&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Segoe UI', Arial, sans-serif;
    background: #14151a;
    color: #e9e9ee;
    display: flex;
    min-height: 100vh;
  }
  #panel {
    width: 340px;
    flex-shrink: 0;
    background: #1c1d24;
    padding: 20px;
    overflow-y: auto;
    border-right: 1px solid #2c2d36;
  }
  #panel h1 {
    font-size: 18px;
    margin: 0 0 20px;
    letter-spacing: 0.3px;
    color: #fff;
    font-weight: 800;
    padding-bottom: 14px;
    border-bottom: 1px solid #2c2d36;
  }
  #panel h2 {
    font-size: 15px;
    margin: 0 0 14px;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    color: #9ea0ad;
  }
  .section { margin-top: 22px; }
  .section:first-of-type { margin-top: 0; }
  .section-header {
    width: 100%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: none;
    border: none;
    padding: 0 0 14px;
    margin: 0;
    cursor: pointer;
    color: #9ea0ad;
    font-size: 15px;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    font-weight: 600;
    font-family: inherit;
  }
  .section-header:hover { color: #cfd0d8; }
  .section-header .chev {
    font-size: 11px;
    color: #6b6d78;
    transition: transform 0.2s ease;
    flex-shrink: 0;
  }
  .section.collapsed .section-header { padding-bottom: 0; }
  .section.collapsed .chev { transform: rotate(-90deg); }
  .section.collapsed .section-body { display: none; }
  #panel label {
    display: block;
    font-size: 12px;
    color: #9ea0ad;
    margin: 14px 0 4px;
  }
  #panel input[type=text], #panel input[type=number], #panel select, #panel textarea {
    width: 100%;
    background: #0f1015;
    border: 1px solid #33343f;
    color: #fff;
    padding: 8px 10px;
    border-radius: 6px;
    font-size: 13px;
  }
  #panel textarea { resize: vertical; min-height: 40px; font-family: inherit; }
  #panel input[readonly] {
    background: #191a22;
    color: #9ea0ad;
    cursor: not-allowed;
  }
  .row2 { display: flex; gap: 8px; }
  .row2 > div { flex: 1; }
  .theme-swatches { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 6px; }
  .swatch {
    flex: 0 0 calc(25% - 6px);
    height: 34px;
    border-radius: 6px;
    cursor: pointer;
    border: 2px solid transparent;
    opacity: 0.75;
  }
  .swatch.active { border-color: #fff; opacity: 1; }
  #sizeBtns { display: flex; gap: 8px; margin-top: 6px; }
  #sizeBtns button {
    flex: 1;
    padding: 8px 4px;
    font-size: 11px;
    background: #0f1015;
    border: 1px solid #33343f;
    color: #cfd0d8;
    border-radius: 6px;
    cursor: pointer;
  }
  #sizeBtns button.active { background: #3d6cf0; border-color: #3d6cf0; color: #fff; }
  #imgFile { font-size: 12px; }
  #downloadBtn {
    width: 100%;
    margin-top: 22px;
    padding: 12px;
    background: #3d6cf0;
    border: none;
    color: #fff;
    font-weight: 700;
    font-size: 14px;
    border-radius: 8px;
    cursor: pointer;
    letter-spacing: 0.3px;
  }
  #downloadBtn:hover { background: #2f5ad9; }
  #resetBtn {
    width: 100%;
    margin-top: 10px;
    padding: 11px;
    background: transparent;
    border: 1px solid #33343f;
    color: #cfd0d8;
    font-weight: 600;
    font-size: 13px;
    border-radius: 8px;
    cursor: pointer;
    letter-spacing: 0.3px;
  }
  #resetBtn:hover { border-color: #ff5a5a; color: #ff5a5a; }
  #stage-wrap {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 30px;
    overflow: auto;
  }

  /* ---- Poster ---- */
  #poster {
    position: relative;
    width: 1080px;
    height: 1080px;
    background: #06070a;
    overflow: hidden;
    transform-origin: center;
    font-family: 'Arial Black', Arial, sans-serif;
    display: flex;
    flex-direction: column;
  }
  #poster .customBg {
    position: absolute; inset: 0;
    z-index: 0;
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
  }
  #poster img.bgImg1 {
    position: absolute; inset: 0;
    z-index: 1;
    width: 100%;
    height: 100%;
    object-fit: cover;
    transform-origin: center;
  }
  #poster .bgOverlay {
    position: absolute; inset: 0;
    z-index: 2;
    background: rgba(6,7,10,0.55);
  }
  #poster .beams {
    position: absolute; inset: 0;
    z-index: 3;
    background:
      repeating-linear-gradient(115deg, transparent 0 40px, rgba(255,255,255,0.02) 40px 42px),
      linear-gradient(135deg, var(--accentA) 0%, transparent 30%),
      linear-gradient(-45deg, var(--accentB) 0%, transparent 30%);
    opacity: 0.35;
  }
  #poster .floor {
    position: absolute; left:0; right:0; bottom:0; height: 30%;
    z-index: 3;
    background: linear-gradient(0deg, rgba(0,0,0,0.6), transparent);
  }
  #poster .content {
    position: relative;
    z-index: 4;
    flex: 1;
    min-height: 0;
    display: flex;
    flex-direction: column;
    padding: 44px 60px 0;
  }
  #poster .eyebrow {
    text-align: center;
    font-size: 26px;
    letter-spacing: 6px;
    color: var(--accentB);
    font-weight: 900;
    margin-bottom: 6px;
    font-family: var(--posterFont, 'Arial Black', Arial, sans-serif);
  }
  #poster .title {
    text-align: center;
    font-size: 64px;
    line-height: 1.0;
    color: #fff;
    font-weight: 900;
    text-transform: var(--posterTransform, uppercase);
    -webkit-text-stroke: 1px rgba(255,255,255,0.05);
    font-family: var(--posterFont, 'Arial Black', Arial, sans-serif);
  }
  #poster .title .accent { color: var(--accentA); }
  #poster .eyebrow .accent, #poster .subtitle .accent, #poster .tagline .accent { color: var(--accentA); }
  #poster .subtitle {
    text-align: center;
    font-size: 22px;
    letter-spacing: 3px;
    color: #cfd0d8;
    font-weight: 400;
    margin-top: 14px;
    text-transform: var(--posterTransform, uppercase);
    font-family: var(--posterFont, 'Arial Black', Arial, sans-serif);
  }
  #poster .subtitle::before, #poster .subtitle::after {
    content: '—';
    color: var(--accentB);
    margin: 0 14px;
  }
  #poster .tagline {
    text-align: center;
    font-size: 26px;
    letter-spacing: 6px;
    color: var(--accentB);
    font-weight: 900;
    margin: 14px 0 20px;
    text-transform: var(--posterTransform, uppercase);
    font-family: var(--posterFont, 'Arial Black', Arial, sans-serif);
  }
  #poster .art {
    flex: 1;
    min-height: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-top: 4px;
    position: relative;
  }
  #poster .art img.pImgMain {
    max-width: 98%;
    max-height: 100%;
    object-fit: contain;
    filter: drop-shadow(0 30px 50px rgba(0,0,0,0.7));
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    z-index: 1;
  }
  #poster .statbar {
    position: relative;
    z-index: 6;
    margin: 0 40px 40px;
    background: rgba(10,11,15,0.85);
    border: 1px solid var(--accentA);
    border-radius: 14px;
    display: flex;
    box-shadow: 0 0 30px -5px var(--accentA);
  }
  #poster .stat {
    flex: 1;
    text-align: center;
    padding: 18px 8px;
    border-right: 1px solid rgba(255,255,255,0.08);
  }
  #poster .stat:last-child { border-right: none; }
  #poster .stat .icon {
    display: block;
    margin: 0 auto 6px;
    width: 26px;
    height: 26px;
    color: var(--accentB);
  }
  #poster .stat .icon svg { width: 100%; height: 100%; display: block; }
  #poster .brandLogo {
    display: block;
    margin: 0 auto;
    width: 130px;
    height: 130px;
    object-fit: contain;
    pointer-events: none;
  }
  #poster .brandLogo.hidden { display: none; }
  #poster .stat.logoStat {
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #poster .stat .label {
    font-size: 15px;
    letter-spacing: 2px;
    color: var(--accentB);
    font-weight: 700;
    text-transform: uppercase;
  }
  #poster .stat .value {
    font-size: 36px;
    color: #fff;
    font-weight: 900;
    margin-top: 4px;
  }
</style>
</head>
<body>

<div id="panel">
  <h1>Grailz Media Template</h1>

  <div class="section collapsed">
    <button type="button" class="section-header"><span>Content</span><span class="chev">&#9660;</span></button>
    <div class="section-body">
  <label>Eyebrow / brand line (use *word* for accent color)</label>
  <input type="text" id="eyebrow" value="GRAILZ ARTIST DROP">

  <label>Title (use *word* for accent color)</label>
  <textarea id="title">Grailz *Artist Drop!*</textarea>

  <label>Subtitle (use *word* for accent color)</label>
  <input type="text" id="subtitle" value="LIMITED EDITION">

  <label>Tagline (use *word* for accent color)</label>
  <input type="text" id="tagline" value="Artist Drop Sales Data">

  <label style="margin-top:16px;">Font style</label>
  <select id="fontStyle">
    <option value="default" selected>Default (Bold Sans)</option>
    <option value="rockstar">Rockstar (Anton)</option>
    <option value="grunge">Grunge / Punk (Permanent Marker)</option>
    <option value="popstar">Popstar (Bungee)</option>
    <option value="country">Country / Western (Rye)</option>
    <option value="street">Street / Hip-Hop (Luckiest Guy)</option>
    <option value="edm">EDM / Futuristic (Orbitron)</option>
    <option value="luxury">Elegant / Luxury (Playfair Display)</option>
    <option value="script">Script / Signature (Pacifico)</option>
    <option value="stadium">Stadium / Varsity (Staatliches)</option>
  </select>
    </div>
  </div>

  <div class="section collapsed">
    <button type="button" class="section-header"><span>Stats</span><span class="chev">&#9660;</span></button>
    <div class="section-body">
  <div class="row2">
    <div><label>Retail (cost)</label><input type="text" id="retail" value="$50"></div>
    <div><label>Resale</label><input type="text" id="resale" value="$130"></div>
  </div>
  <div class="row2">
    <div><label>Return (auto)</label><input type="text" id="ret" value="X2.6" readonly></div>
    <div><label>Profit (auto)</label><input type="text" id="profit" value="$80" readonly></div>
  </div>
    </div>
  </div>

  <div class="section collapsed">
    <button type="button" class="section-header"><span>Theme</span><span class="chev">&#9660;</span></button>
    <div class="section-body">
  <div class="theme-swatches">
    <div class="swatch" data-a="#ff2e63" data-b="#2ec5ff" style="background:linear-gradient(90deg,#ff2e63,#2ec5ff)" title="Pink/Blue" data-logo="pinkblue"></div>
    <div class="swatch" data-a="#3dff8f" data-b="#ffffff" style="background:linear-gradient(90deg,#3dff8f,#888)" title="Green/White" data-logo="greenwhite"></div>
    <div class="swatch" data-a="#8a4dff" data-b="#2ec5ff" style="background:linear-gradient(90deg,#8a4dff,#2ec5ff)" title="Purple/Blue" data-logo="purpleblue"></div>
    <div class="swatch" data-a="#ffb400" data-b="#ff2e63" style="background:linear-gradient(90deg,#ffb400,#ff2e63)" title="Amber/Pink" data-logo="amberpink"></div>
    <div class="swatch" data-a="#00e0c6" data-b="#ffffff" style="background:linear-gradient(90deg,#00e0c6,#888)" title="Teal/White" data-logo="tealwhite"></div>
    <div class="swatch" data-a="#ff3b3b" data-b="#ffffff" style="background:linear-gradient(90deg,#ff3b3b,#888)" title="Red/White" data-logo="redwhite"></div>
    <div class="swatch" data-a="#ffd700" data-b="#f2f2f2" style="background:linear-gradient(90deg,#ffd700,#444)" title="Gold/Black" data-logo="goldblack"></div>
    <div class="swatch active" id="defaultTheme" data-a="#ff00d4" data-b="#00fff0" style="background:linear-gradient(90deg,#ff00d4,#00fff0)" title="Magenta/Cyan" data-logo="magentacyan"></div>
    <div class="swatch" data-a="#2ec5ff" data-b="#ff8a00" style="background:linear-gradient(90deg,#2ec5ff,#ff8a00)" title="Blue/Orange" data-logo="blueorange"></div>
    <div class="swatch" data-a="#b6ff00" data-b="#a64dff" style="background:linear-gradient(90deg,#b6ff00,#a64dff)" title="Lime/Purple" data-logo="limepurple"></div>
    <div class="swatch" data-a="#ff1a4b" data-b="#e0e0e0" style="background:linear-gradient(90deg,#ff1a4b,#888)" title="Crimson/Silver" data-logo="crimsonsilver"></div>
    <div class="swatch" data-a="#7ee8fa" data-b="#ff6fc7" style="background:linear-gradient(90deg,#7ee8fa,#ff6fc7)" title="Ice/Pink" data-logo="icepink"></div>
    <div class="swatch" data-a="#00ffab" data-b="#ffd700" style="background:linear-gradient(90deg,#00ffab,#ffd700)" title="Emerald/Gold" data-logo="emeraldgold"></div>
    <div class="swatch" data-a="#9d4edd" data-b="#fff200" style="background:linear-gradient(90deg,#9d4edd,#fff200)" title="Violet/Yellow" data-logo="violetyellow"></div>
    <div class="swatch" data-a="#ff6f59" data-b="#00e0c6" style="background:linear-gradient(90deg,#ff6f59,#00e0c6)" title="Coral/Teal" data-logo="coralteal"></div>
    <div class="swatch" data-a="#39ff14" data-b="#f2f2f2" style="background:linear-gradient(90deg,#39ff14,#888)" title="Neon Green/White" data-logo="neongreenwhite"></div>
  </div>
    </div>
  </div>

  <div class="section collapsed">
    <button type="button" class="section-header"><span>Media</span><span class="chev">&#9660;</span></button>
    <div class="section-body">

  <label style="margin-top:0;">Background 1 (full-bleed) URL, or upload below</label>
  <input type="text" id="imgUrl" placeholder="https://...">
  <input type="file" id="imgFile" accept="image/*" style="margin-top:6px;">
  <label>Background 1 opacity</label>
  <div class="fx-opacity" style="display:flex;align-items:center;gap:8px;margin-top:6px;">
    <input type="range" id="img1Opacity" min="0" max="100" value="22" style="flex:1;">
    <span id="img1OpacityLabel" style="font-size:11px;color:#9ea0ad;width:32px;text-align:right;">22%</span>
  </div>
  <label>Background 1 zoom</label>
  <div class="fx-opacity" style="display:flex;align-items:center;gap:8px;margin-top:6px;">
    <input type="range" id="img1Size" min="100" max="220" value="100" style="flex:1;">
    <span id="img1SizeLabel" style="font-size:11px;color:#9ea0ad;width:32px;text-align:right;">100%</span>
  </div>

  <label style="margin-top:16px;">Background 2 URL, or upload below</label>
  <input type="text" id="bgUrl" placeholder="https://...">
  <input type="file" id="bgFile" accept="image/*" style="margin-top:6px;">
  <label>Background 2 opacity</label>
  <div class="fx-opacity" style="display:flex;align-items:center;gap:8px;margin-top:6px;">
    <input type="range" id="bgOpacity" min="0" max="100" value="100" style="flex:1;">
    <span id="bgOpacityLabel" style="font-size:11px;color:#9ea0ad;width:32px;text-align:right;">100%</span>
  </div>
  <label>Background 2 zoom</label>
  <div class="fx-opacity" style="display:flex;align-items:center;gap:8px;margin-top:6px;">
    <input type="range" id="bgSize" min="100" max="220" value="100" style="flex:1;">
    <span id="bgSizeLabel" style="font-size:11px;color:#9ea0ad;width:32px;text-align:right;">100%</span>
  </div>

  <label style="margin-top:16px;">Main product image URL, or upload below</label>
  <input type="text" id="imgUrl2" placeholder="https://...">
  <input type="file" id="imgFile2" accept="image/*" style="margin-top:6px;">
  <label>Product opacity</label>
  <div class="fx-opacity" style="display:flex;align-items:center;gap:8px;margin-top:6px;">
    <input type="range" id="img2Opacity" min="0" max="100" value="100" style="flex:1;">
    <span id="img2OpacityLabel" style="font-size:11px;color:#9ea0ad;width:32px;text-align:right;">100%</span>
  </div>
  <label>Product size</label>
  <div class="fx-opacity" style="display:flex;align-items:center;gap:8px;margin-top:6px;">
    <input type="range" id="img2Size" min="30" max="180" value="100" style="flex:1;">
    <span id="img2SizeLabel" style="font-size:11px;color:#9ea0ad;width:32px;text-align:right;">100%</span>
  </div>

  <label style="margin-top:16px;">Grailz logo</label>
  <div style="display:flex;align-items:center;gap:10px;margin-top:6px;">
    <input type="checkbox" id="logoShow" checked>
    <label for="logoShow" style="margin:0;font-size:13px;color:#e9e9ee;">Show Grailz logo</label>
  </div>
    </div>
  </div>

  <div class="section collapsed">
    <button type="button" class="section-header"><span>Platform size</span><span class="chev">&#9660;</span></button>
    <div class="section-body">
  <div id="sizeBtns">
    <button class="active" data-w="1080" data-h="1080">Square 1:1</button>
    <button data-w="1080" data-h="1350">Portrait 4:5</button>
    <button data-w="1080" data-h="1920">Story 9:16</button>
  </div>
    </div>
  </div>

  <button id="downloadBtn">Download PNG</button>
  <button id="resetBtn">Reset to defaults</button>
</div>

<div id="stage-wrap">
  <div id="poster" style="--accentA:#ff2e63; --accentB:#2ec5ff;">
    <div class="customBg" id="customBg"></div>
    <img id="pImg" class="bgImg1" src="" alt="">
    <div class="bgOverlay" id="bgOverlay"></div>
    <div class="beams"></div>
    <div class="floor"></div>
    <div class="content">
      <div class="eyebrow" id="pEyebrow">GRAILZ ARTIST DROP</div>
      <div class="title" id="pTitle">Grailz <span class="accent">Artist Drop!</span></div>
      <div class="subtitle" id="pSubtitle">LIMITED EDITION</div>
      <div class="art">
        <img id="pImg2" class="pImgMain" src="" alt="">
      </div>
      <div class="tagline" id="pTagline">Artist Drop Sales Data</div>
    </div>
    <div class="statbar">
      <div class="stat logoStat">
        <img class="brandLogo" id="brandLogo" src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBTAA7" alt="Grailz logo">
      </div>
      <div class="stat">
        <div class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12.586 2.586A2 2 0 0 0 11.172 2H4a2 2 0 0 0-2 2v7.172a2 2 0 0 0 .586 1.414l8.704 8.704a2.426 2.426 0 0 0 3.42 0l6.58-6.58a2.426 2.426 0 0 0 0-3.42z"/><circle cx="7.5" cy="7.5" r="1.5"/></svg></div>
        <div class="label">Retail</div><div class="value" id="pRetail">$50</div>
      </div>
      <div class="stat">
        <div class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 17 9 11 13 15 21 7"/><polyline points="14 7 21 7 21 14"/></svg></div>
        <div class="label">Resale</div><div class="value" id="pResale">$130</div>
      </div>
      <div class="stat">
        <div class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg></div>
        <div class="label">Return</div><div class="value" id="pReturn">X2.6</div>
      </div>
      <div class="stat">
        <div class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="20" height="12" rx="2"/><circle cx="12" cy="12" r="3"/><path d="M6 12h.01M18 12h.01"/></svg></div>
        <div class="label">Profit</div><div class="value" id="pProfit">$80</div>
      </div>
    </div>
  </div>
</div>

const stageWrap = document.getElementById('stage-wrap');

function fitStage() {
  const w = poster.offsetWidth, h = poster.offsetHeight;

  const availH = stageWrap.clientHeight - 60;
  const scale = Math.min(availW / w, availH / h, 1);
  poster.style.transform = `scale(${scale})`;
}

function parseAccent(raw) {
  return raw.replace(/\*(.+?)\*/g, '<span class="accent">$1</span>');
}

function parseMoney(str) {
  const n = parseFloat(String(str).replace(/[^0-9.\-]/g, ''));
  return isNaN(n) ? 0 : n;
}

/* ---- Font style ---- */
const FONT_MAP = {
  default: { family: `'Arial Black', Arial, sans-serif`, upper: 'uppercase' },
  rockstar: { family: `'Anton', 'Arial Black', sans-serif`, upper: 'uppercase' },
  grunge: { family: `'Permanent Marker', cursive`, upper: 'none' },
  popstar: { family: `'Bungee', 'Arial Black', sans-serif`, upper: 'uppercase' },
  country: { family: `'Rye', serif`, upper: 'uppercase' },
  street: { family: `'Luckiest Guy', cursive`, upper: 'uppercase' },
  edm: { family: `'Orbitron', sans-serif`, upper: 'uppercase' },
  luxury: { family: `'Playfair Display', serif`, upper: 'none' },
  script: { family: `'Pacifico', cursive`, upper: 'none' },
  stadium: { family: `'Staatliches', sans-serif`, upper: 'uppercase' }
};

function syncFont() {
  const key = document.getElementById('fontStyle').value;
  const f = FONT_MAP[key] || FONT_MAP.default;
  poster.style.setProperty('--posterFont', f.family);
  poster.style.setProperty('--posterTransform', f.upper);
}
document.getElementById('fontStyle').addEventListener('change', syncFont);

function calcStats() {
  const retailVal = parseMoney(document.getElementById('retail').value);
  const resaleVal = parseMoney(document.getElementById('resale').value);
  if (retailVal > 0) {
    const ret = resaleVal / retailVal;
    const profit = resaleVal - retailVal;
    document.getElementById('ret').value = 'X' + ret.toFixed(1);
    document.getElementById('profit').value = (profit < 0 ? '-$' : '$') + Math.abs(profit).toFixed(0);
  } else {
    document.getElementById('ret').value = 'X0.0';
    document.getElementById('profit').value = '$0';
  }
}

function sync() {
  document.getElementById('pEyebrow').innerHTML = parseAccent(document.getElementById('eyebrow').value);
  document.getElementById('pTitle').innerHTML = parseAccent(document.getElementById('title').value);
  document.getElementById('pSubtitle').innerHTML = parseAccent(document.getElementById('subtitle').value);
  document.getElementById('pTagline').innerHTML = parseAccent(document.getElementById('tagline').value);
  document.getElementById('pRetail').textContent = document.getElementById('retail').value;
  document.getElementById('pResale').textContent = document.getElementById('resale').value;
  document.getElementById('pReturn').textContent = document.getElementById('ret').value;
  document.getElementById('pProfit').textContent = document.getElementById('profit').value;
  const url = document.getElementById('imgUrl').value;
  if (url) document.getElementById('pImg').src = url;
  const url2 = document.getElementById('imgUrl2').value;
  if (url2) document.getElementById('pImg2').src = url2;
  fitStage();
}

['eyebrow','title','subtitle','tagline','imgUrl','imgUrl2'].forEach(id => {
  document.getElementById(id).addEventListener('input', sync);
});

['retail','resale'].forEach(id => {
  document.getElementById(id).addEventListener('input', () => {
    calcStats();
    sync();
  });
});

document.getElementById('imgFile').addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (ev) => {
    document.getElementById('pImg').src = ev.target.result;
    document.getElementById('imgUrl').value = '';
  };
  reader.readAsDataURL(file);
});

document.getElementById('imgFile2').addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (ev) => {
    document.getElementById('pImg2').src = ev.target.result;
    document.getElementById('imgUrl2').value = '';
  };
  reader.readAsDataURL(file);
});

function syncImgOpacity() {
  document.getElementById('pImg').style.opacity = document.getElementById('img1Opacity').value / 100;
  document.getElementById('pImg2').style.opacity = document.getElementById('img2Opacity').value / 100;
}
document.getElementById('img1Opacity').addEventListener('input', () => {
  document.getElementById('img1OpacityLabel').textContent = document.getElementById('img1Opacity').value + '%';
  syncImgOpacity();
});
document.getElementById('img2Opacity').addEventListener('input', () => {
  document.getElementById('img2OpacityLabel').textContent = document.getElementById('img2Opacity').value + '%';
  syncImgOpacity();
});

function syncImgSize() {
  const s1 = document.getElementById('img1Size').value / 100;
  const s2 = document.getElementById('img2Size').value / 100;
  document.getElementById('pImg').style.transform = `scale(${s1})`;
  document.getElementById('pImg2').style.transform = `translate(-50%, -50%) scale(${s2})`;
}
document.getElementById('img1Size').addEventListener('input', () => {
  document.getElementById('img1SizeLabel').textContent = document.getElementById('img1Size').value + '%';
  syncImgSize();
});
document.getElementById('img2Size').addEventListener('input', () => {
  document.getElementById('img2SizeLabel').textContent = document.getElementById('img2Size').value + '%';
  syncImgSize();
});

function setBg(src) {
  const el = document.getElementById('customBg');
  el.style.backgroundImage = src ? `url('${src}')` : 'none';
}

document.getElementById('bgUrl').addEventListener('input', (e) => {
  setBg(e.target.value);
});

document.getElementById('bgFile').addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (ev) => {
    setBg(ev.target.result);
    document.getElementById('bgUrl').value = '';
  };
  reader.readAsDataURL(file);
});

function syncCustomBg() {
  const el = document.getElementById('customBg');
  const op = document.getElementById('bgOpacity').value / 100;
  const zoom = document.getElementById('bgSize').value / 100;
  el.style.opacity = op;
  el.style.transform = `scale(${zoom})`;
}
document.getElementById('bgOpacity').addEventListener('input', () => {
  document.getElementById('bgOpacityLabel').textContent = document.getElementById('bgOpacity').value + '%';
  syncCustomBg();
});
document.getElementById('bgSize').addEventListener('input', () => {
  document.getElementById('bgSizeLabel').textContent = document.getElementById('bgSize').value + '%';
  syncCustomBg();
});

/* ---- Brand logo ---- */
function syncLogo() {
  const logo = document.getElementById('brandLogo');
  const show = document.getElementById('logoShow').checked;
  logo.classList.toggle('hidden', !show);
}
document.getElementById('logoShow').addEventListener('change', syncLogo);

function syncLogoVariant(swatchEl) {
  const key = swatchEl.dataset.logo;
  const logo = document.getElementById('brandLogo');
  if (key && LOGO_VARIANTS[key]) {
    logo.src = LOGO_VARIANTS[key];
  }
}

document.querySelectorAll('.swatch').forEach(sw => {
  sw.addEventListener('click', () => {
    document.querySelectorAll('.swatch').forEach(s => s.classList.remove('active'));
    sw.classList.add('active');
    poster.style.setProperty('--accentA', sw.dataset.a);
    poster.style.setProperty('--accentB', sw.dataset.b);
    syncLogoVariant(sw);
  });
});


document.querySelectorAll('#sizeBtns button').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('#sizeBtns button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    poster.style.width = btn.dataset.w + 'px';
    poster.style.height = btn.dataset.h + 'px';
    fitStage();
  });
});

/* ---- Collapsible sections ---- */
document.querySelectorAll('.section-header').forEach(btn => {
  btn.addEventListener('click', () => {
    btn.closest('.section').classList.toggle('collapsed');
  });
});

document.getElementById('downloadBtn').addEventListener('click', () => {
  const prevTransform = poster.style.transform;
  poster.style.transform = 'none';
  html2canvas(poster, { backgroundColor: '#06070a', scale: 1 }).then(canvas => {
    poster.style.transform = prevTransform;
    const link = document.createElement('a');
    link.download = 'flip-post.png';
    link.href = canvas.toDataURL('image/png');
    link.click();
  });
});

const DEFAULTS = {
  eyebrow: 'GRAILZ ARTIST DROP',
  title: 'Grailz *Artist Drop!*',
  subtitle: 'LIMITED EDITION',
  tagline: 'Artist Drop Sales Data',
  retail: '$50',
  resale: '$130'
};

document.getElementById('resetBtn').addEventListener('click', () => {
  Object.keys(DEFAULTS).forEach(id => {
    document.getElementById(id).value = DEFAULTS[id];
  });
  document.getElementById('fontStyle').value = 'default';
  syncFont();
  document.getElementById('imgUrl').value = '';
  document.getElementById('imgFile').value = '';
  document.getElementById('pImg').src = '';
  document.getElementById('imgUrl2').value = '';
  document.getElementById('imgFile2').value = '';
  document.getElementById('pImg2').src = '';
  document.getElementById('img1Opacity').value = 22;
  document.getElementById('img1OpacityLabel').textContent = '22%';
  document.getElementById('img2Opacity').value = 100;
  document.getElementById('img2OpacityLabel').textContent = '100%';
  syncImgOpacity();
  document.getElementById('img1Size').value = 100;
  document.getElementById('img1SizeLabel').textContent = '100%';
  document.getElementById('img2Size').value = 100;
  document.getElementById('img2SizeLabel').textContent = '100%';
  syncImgSize();
  document.getElementById('bgUrl').value = '';
  document.getElementById('bgFile').value = '';
  setBg(null);
  document.getElementById('bgOpacity').value = 100;
  document.getElementById('bgOpacityLabel').textContent = '100%';
  document.getElementById('bgSize').value = 100;
  document.getElementById('bgSizeLabel').textContent = '100%';
  syncCustomBg();

  document.querySelectorAll('.swatch').forEach(s => s.classList.remove('active'));
  const firstSwatch = document.querySelector('.swatch');
  firstSwatch.classList.add('active');
  poster.style.setProperty('--accentA', firstSwatch.dataset.a);
  poster.style.setProperty('--accentB', firstSwatch.dataset.b);
  syncLogoVariant(firstSwatch);

  document.querySelectorAll('#sizeBtns button').forEach(b => b.classList.remove('active'));
  const firstSize = document.querySelector('#sizeBtns button');
  firstSize.classList.add('active');
  poster.style.width = firstSize.dataset.w + 'px';
  poster.style.height = firstSize.dataset.h + 'px';

  document.getElementById('logoShow').checked = true;
  syncLogo();

  calcStats();
  sync();
});

window.addEventListener('resize', fitStage);
window.addEventListener('load', () => { calcStats(); sync(); fitStage(); syncLogo(); syncImgOpacity(); syncImgSize(); syncCustomBg(); syncFont(); });
calcStats();
sync();
syncLogo();
const initialSwatch = document.querySelector('.swatch.active') || document.querySelector('.swatch');
if (initialSwatch) syncLogoVariant(initialSwatch);
syncImgOpacity();
syncImgSize();
syncCustomBg();
syncFont();
</script>

</body>
</html>
